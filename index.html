<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolliBot 🐝</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #dff7ff;
    color: #263238;
    text-align: center;
}

header {
    background: #ffd83d;
    padding: 16px;
    border-bottom: 5px solid #e5b900;
}

h1 {
    margin: 0;
    font-size: 38px;
}

#levelTitle {
    margin-top: 5px;
    font-weight: bold;
}

.game {
    max-width: 1000px;
    margin: auto;
    padding: 14px;
}

#message {
    min-height: 44px;
    margin: 10px;
    font-size: 18px;
    font-weight: bold;
}

#board-wrap {
    width: 100%;
    overflow: auto;
    padding: 6px;
}

#board {
    --cell-size: 52px;

    display: grid;
    gap: 3px;
    width: max-content;
    margin: 0 auto;
    padding: 5px;

    background: #548b38;
    border: 5px solid #416b2c;
    border-radius: 12px;
}

.cell {
    width: var(--cell-size);
    height: var(--cell-size);

    display: flex;
    align-items: center;
    justify-content: center;

    background: #b8e986;
    border-radius: 5px;

    font-size: 30px;
    user-select: none;
}

.wall {
    background: #68747c;
    box-shadow: inset 0 0 0 2px #4d565c;
}

.bee {
    background: #ffe66d;
}

.controls {
    margin-top: 15px;
    background: white;
    padding: 16px;
    border-radius: 15px;
    box-shadow: 0 4px 12px #0002;
}

button {
    font-size: 16px;
    padding: 11px 15px;
    margin: 4px;

    border: 0;
    border-radius: 9px;

    background: #ffca28;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #ffb300;
    transform: scale(1.03);
}

#run {
    background: #66bb6a;
    color: white;
}

#reset {
    background: #ef5350;
    color: white;
}

#next {
    background: #42a5f5;
    color: white;
    display: none;
}

#commands {
    min-height: 50px;
    margin: 10px 0;
    padding: 10px;
    background: #f5f5f5;
    border-radius: 10px;
}

.command {
    display: inline-block;
    background: #fff176;
    padding: 6px 9px;
    margin: 3px;
    border-radius: 6px;
    font-size: 14px;
}

.stats {
    margin: 8px;
    font-weight: bold;
}

.instructions {
    margin-top: 14px;
    font-size: 15px;
}
</style>
</head>

<body>

<header>
    <h1>🐝 PolliBot</h1>
    <div id="levelTitle">Level 1 of 10</div>
</header>

<div class="game">

    <div id="message">
        Pollinate every flower! 🌼
    </div>

    <div class="stats">
        Commands:
        <span id="commandCount">0</span> /
        <span id="commandLimit">25</span>
    </div>

    <div id="board-wrap">
        <div id="board"></div>
    </div>

    <div class="controls">

        <h3>Your program:</h3>

        <div id="commands">
            No commands yet!
        </div>

        <button onclick="addCommand('forward')">
            ⬆️ Forward
        </button>

        <button onclick="addCommand('left')">
            ↩️ Turn Left
        </button>

        <button onclick="addCommand('right')">
            ↪️ Turn Right
        </button>

        <button onclick="addCommand('pollinate')">
            🌼 Pollinate
        </button>

        <br>

        <button id="run" onclick="runProgram()">
            ▶️ Run!
        </button>

        <button id="reset" onclick="resetLevel()">
            🗑️ Clear
        </button>

        <button id="next" onclick="nextLevel()">
            ➡️ Next Level
        </button>

    </div>

    <div class="instructions">
        <p>🧠 Plan the route before you run it.</p>
        <p>🚧 Walls cannot be crossed.</p>
        <p>🌸 Pollinate every flower to complete the level.</p>
    </div>

</div>

let currentLevel = 0;

let bee;

let flowers = [];

let commands = [];

let running = false;


/* =========================
   LOAD LEVEL
   ========================= */

function loadLevel() {

    const level = levels[currentLevel];

    bee = {
        row: level.bee[0],
        col: level.bee[1],
        direction: level.direction
    };

    flowers = level.flowers.map(position => ({
        row: position[0],
        col: position[1],
        pollinated: false
    }));

    commands = [];

    document.getElementById("levelTitle").textContent =
        `Level ${currentLevel + 1} of ${levels.length}`;

    document.getElementById("commandLimit").textContent =
        level.limit;

    document.getElementById("message").textContent =
        "Pollinate every flower! 🌼";

    document.getElementById("next").style.display =
        "none";

    drawBoard();

    updateCommands();
}


/* =========================
   CHECK WALL
   ========================= */

function isWall(row, col) {

    return levels[currentLevel].walls.some(
        wall =>
            wall[0] === row &&
            wall[1] === col
    );
}


/* =========================
   DRAW BOARD
   ========================= */

function drawBoard() {

    const board =
        document.getElementById("board");

    const size =
        levels[currentLevel].size;

    let cellSize =
        size >= 14 ? 42 :
        size >= 12 ? 46 :
        52;

    board.style.setProperty(
        "--cell-size",
        cellSize + "px"
    );

    board.style.gridTemplateColumns =
        `repeat(${size}, var(--cell-size))`;

    board.innerHTML = "";


    for (let row = 0; row < size; row++) {

        for (let col = 0; col < size; col++) {

            const cell =
                document.createElement("div");

            cell.className = "cell";


            /* WALL */

            if (isWall(row, col)) {

                cell.classList.add("wall");

                cell.textContent = "🧱";
            }


            /* FLOWER */

            const flower =
                flowers.find(
                    f =>
                        f.row === row &&
                        f.col === col
                );


            if (flower) {

                cell.textContent =
                    flower.pollinated
                        ? "🌸"
                        : "🌼";
            }


            /* BEE */

            if (
                bee.row === row &&
                bee.col === col
            ) {

                cell.classList.add("bee");

                cell.textContent = "🐝";
            }


            board.appendChild(cell);
        }
    }
}


/* =========================
   ADD COMMAND
   ========================= */

function addCommand(command) {

    if (running) {
        return;
    }

    if (
        commands.length >=
        levels[currentLevel].limit
    ) {

        document.getElementById("message").textContent =
            "🧠 You've reached the command limit!";

        return;
    }

    commands.push(command);

    updateCommands();
}


/* =========================
   UPDATE COMMAND DISPLAY
   ========================= */

function updateCommands() {

    const box =
        document.getElementById("commands");

    document.getElementById("commandCount").textContent =
        commands.length;


    if (!commands.length) {

        box.textContent =
            "No commands yet!";

        return;
    }


    box.innerHTML = "";


    const names = {

        forward: "⬆️ Forward",

        left: "↩️ Left",

        right: "↪️ Right",

        pollinate: "🌼 Pollinate"

    };


    commands.forEach(
        (command, index) => {

            const span =
                document.createElement("span");

            span.className =
                "command";

            span.textContent =
                `${index + 1}. ${names[command]}`;

            box.appendChild(span);
        }
    );
}


/* =========================
   RESET LEVEL
   ========================= */

function resetLevel() {

    if (!running) {

        loadLevel();
    }
}


/* =========================
   WAIT
   ========================= */

function sleep(milliseconds) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                milliseconds
            )
    );
}


/* =========================
   RUN PROGRAM
   ========================= */

async function runProgram() {

    if (
        running ||
        !commands.length
    ) {
        return;
    }

    running = true;

    document.getElementById("message").textContent =
        "🐝 Here we go!";


    for (const command of commands) {

        await sleep(350);


        /* TURN LEFT */

        if (command === "left") {

            bee.direction--;

            if (bee.direction < 0) {

                bee.direction = 3;
            }
        }


        /* TURN RIGHT */

        else if (command === "right") {

            bee.direction++;

            if (bee.direction > 3) {

                bee.direction = 0;
            }
        }


        /* MOVE FORWARD */

        else if (command === "forward") {

            let row = bee.row;

            let col = bee.col;


            /*
                0 = up
                1 = right
                2 = down
                3 = left
            */

            if (bee.direction === 0) {
                row--;
            }

            if (bee.direction === 1) {
                col++;
            }

            if (bee.direction === 2) {
                row++;
            }

            if (bee.direction === 3) {
                col--;
            }


            const size =
                levels[currentLevel].size;


            /* HIT EDGE */

            if (
                row < 0 ||
                row >= size ||
                col < 0 ||
                col >= size
            ) {

                document.getElementById("message").textContent =
                    "💥 Bonk! The bee hit the edge!";

                running = false;

                drawBoard();

                return;
            }


            /* HIT WALL */

            if (isWall(row, col)) {

                document.getElementById("message").textContent =
                    "🚧 Bonk! That's a wall!";

                running = false;

                drawBoard();

                return;
            }


            bee.row = row;

            bee.col = col;
        }


        /* POLLINATE */

        else if (command === "pollinate") {

            const flower =
                flowers.find(
                    f =>
                        f.row === bee.row &&
                        f.col === bee.col
                );


            if (flower) {

                if (!flower.pollinated) {

                    flower.pollinated = true;

                    document.getElementById("message").textContent =
                        "🌸 Flower pollinated!";
                }

                else {

                    document.getElementById("message").textContent =
                        "🌸 Already pollinated!";
                }
            }

            else {

                document.getElementById("message").textContent =
                    "🐝 There's no flower here!";
            }
        }


        drawBoard();
    }


    await sleep(450);


    /* CHECK WIN */

    const won =
        flowers.every(
            flower =>
                flower.pollinated
        );


    if (won) {

        /* FINAL LEVEL */

        if (
            currentLevel ===
            levels.length - 1
        ) {

            document.getElementById("message").textContent =
                "🏆 AMAZING! You completed all 10 levels! 🐝🌸";
        }

        /* NORMAL LEVEL */

        else {

            document.getElementById("message").textContent =
                "🎉 Level complete! Every flower is pollinated!";

            document.getElementById("next").style.display =
                "inline-block";
        }
    }

    else {

        document.getElementById("message").textContent =
            "🌼 Not all the flowers are pollinated yet!";
    }


    running = false;
}


/* =========================
   NEXT LEVEL
   ========================= */

function nextLevel() {

    if (
        currentLevel <
        levels.length - 1
    ) {

        currentLevel++;

        loadLevel();
    }
}


/* =========================
   START GAME
   ========================= */

loadLevel();

</script>
