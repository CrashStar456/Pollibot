<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PolliBot 🐝</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #dff7ff;
        color: #263238;
        text-align: center;
    }

    header {
        background: #ffd83d;
        padding: 18px;
        border-bottom: 5px solid #e5b900;
    }

    h1 {
        margin: 0;
        font-size: 40px;
    }

    #levelTitle {
        margin-top: 5px;
        font-size: 18px;
        font-weight: bold;
    }

    .game {
        max-width: 900px;
        margin: auto;
        padding: 15px;
    }

    #message {
        min-height: 45px;
        margin: 12px;
        font-size: 18px;
        font-weight: bold;
    }

    /* THE GRID */

    #board {
        --cell-size: 52px;

        display: grid;
        gap: 3px;

        width: max-content;
        max-width: 95vw;
        margin: 15px auto;

        padding: 5px;

        background: #548b38;
        border: 5px solid #416b2c;
        border-radius: 12px;

        overflow: auto;
    }

    .cell {
        width: var(--cell-size);
        height: var(--cell-size);

        display: flex;
        align-items: center;
        justify-content: center;

        background: #b8e986;

        border-radius: 5px;

        font-size: 30px;

        user-select: none;
    }

    /* Walls */

    .wall {
        background: #65727b;
        box-shadow: inset 0 0 0 2px #4c565d;
    }

    /* Bee */

    .bee {
        background: #ffe66d;
    }

    /* Controls */

    .controls {
        background: white;
        padding: 18px;
        border-radius: 15px;

        box-shadow: 0 4px 12px #0002;
    }

    button {
        font-size: 16px;

        padding: 11px 15px;
        margin: 4px;

        border: none;
        border-radius: 9px;

        background: #ffca28;

        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #ffb300;
        transform: scale(1.03);
    }

    #run {
        background: #66bb6a;
        color: white;
    }

    #reset {
        background: #ef5350;
        color: white;
    }

    #next {
        background: #42a5f5;
        color: white;
        display: none;
    }

    #commands {
        min-height: 50px;

        margin: 10px 0;
        padding: 10px;

        background: #f5f5f5;
        border-radius: 10px;
    }

    .command {
        display: inline-block;

        background: #fff176;

        padding: 6px 9px;
        margin: 3px;

        border-radius: 6px;

        font-size: 14px;
    }

    .instructions {
        margin-top: 15px;
        font-size: 15px;
    }

    .legend {
        margin: 10px;
        font-size: 14px;
    }
</style>
</head>

<body>

<header>
    <h1>🐝 PolliBot</h1>
    <div id="levelTitle">Level 1</div>
</header>

<div class="game">

    <div id="message">
        Pollinate every flower! 🌼
    </div>

    <div class="legend">
        🐝 Bee &nbsp;&nbsp;
        🌼 Flower &nbsp;&nbsp;
        🧱 Wall &nbsp;&nbsp;
        🌸 Pollinated
    </div>

    <div id="board"></div>

    <div class="controls">

        <h3>Your program:</h3>

        <div id="commands">
            No commands yet!
        </div>

        <button onclick="addCommand('forward')">
            ⬆️ Forward
        </button>

        <button onclick="addCommand('left')">
            ↩️ Turn Left
        </button>

        <button onclick="addCommand('right')">
            ↪️ Turn Right
        </button>

        <button onclick="addCommand('pollinate')">
            🌼 Pollinate
        </button>

        <br>

        <button id="run" onclick="runProgram()">
            ▶️ Run!
        </button>

        <button id="reset" onclick="resetLevel()">
            🗑️ Clear
        </button>

        <button id="next" onclick="nextLevel()">
            ➡️ Next Level
        </button>

    </div>

    <div class="instructions">

        <p>
            💡 Build a program for the bee.
        </p>

        <p>
            🚧 The bee cannot fly through walls!
        </p>

        <p>
            🌸 You must pollinate <b>every flower</b> to complete a level.
        </p>

    </div>

</div>

<script>

/*
===========================================================
POLLIBOT
A little programming puzzle game about bees and flowers.
===========================================================
*/


/*
DIRECTIONS

0 = up
1 = right
2 = down
3 = left
*/


const levels = [

    /*
    LEVEL 1
    Simple introduction
    */

    {
        size: 6,

        bee: [5, 0],
        direction: 1,

        flowers: [
            [5, 5]
        ],

        walls: [
            [4, 2],
            [3, 2],
            [2, 2]
        ]
    },


    /*
    LEVEL 2
    */

    {
        size: 7,

        bee: [6, 0],
        direction: 0,

        flowers: [
            [0, 6]
        ],

        walls: [
            [5, 2],
            [4, 2],
            [3, 2],
            [3, 3],
            [3, 4],
            [4, 4],
            [5, 4]
        ]
    },


    /*
    LEVEL 3
    */

    {
        size: 8,

        bee: [7, 0],
        direction: 1,

        flowers: [
            [0, 7]
        ],

        walls: [
            [6, 2],
            [5, 2],
            [4, 2],
            [3, 2],
            [3, 3],
            [3, 4],
            [3, 5],
            [4, 5],
            [5, 5],
            [6, 5]
        ]
    },


    /*
    LEVEL 4
    Two flowers
    */

    {
        size: 8,

        bee: [7, 0],
        direction: 0,

        flowers: [
            [0, 7],
            [4, 4]
        ],

        walls: [
            [6, 1],
            [5, 1],
            [4, 1],
            [3, 1],
            [2, 1],

            [2, 2],
            [2, 3],
            [2, 4],

            [3, 4],
            [4, 4],

            [5, 6],
            [4, 6],
            [3, 6],
            [2, 6]
        ]
    },


    /*
    LEVEL 5
    */

    {
        size: 9,

        bee: [8, 0],
        direction: 0,

        flowers: [
            [0, 8],
            [4, 4]
        ],

        walls: [
            [7, 1],
            [6, 1],
            [5, 1],
            [4, 1],
            [3, 1],

            [3, 2],
            [3, 3],
            [3, 4],

            [4, 4],

            [5, 4],
            [6, 4],

            [6, 6],
            [5, 6],
            [4, 6],
            [3, 6],
            [2, 6],

            [2, 7]
        ]
    },


    /*
    LEVEL 6
    Three flowers
    */

    {
        size: 9,

        bee: [8, 0],
        direction: 1,

        flowers: [
            [8, 8],
            [4, 4],
            [0, 8]
        ],

        walls: [
            [7, 2],
            [6, 2],
            [5, 2],
            [4, 2],
            [3, 2],

            [3, 3],
            [3, 4],

            [5, 4],
            [6, 4],
            [7, 4],

            [7, 6],
            [6, 6],
            [5, 6],
            [4, 6],
            [3, 6],

            [3, 7]
        ]
    },


    /*
    LEVEL 7
    */

    {
        size: 10,

        bee: [9, 0],
        direction: 0,

        flowers: [
            [0, 9],
            [4, 4],
            [8, 8]
        ],

        walls: [

            [8, 1],
            [7, 1],
            [6, 1],
            [5, 1],
            [4, 1],

            [4, 2],
            [4, 3],

            [2, 3],
            [3, 3],

            [2, 4],
            [2, 5],
            [2, 6],

            [3, 6],
            [4, 6],
            [5, 6],

            [5, 7],
            [5, 8],

            [7, 8],
            [8, 8]
        ]
    },


    /*
    LEVEL 8
    */

    {
        size: 10,

        bee: [9, 0],
        direction: 1,

        flowers: [
            [0, 9],
            [3, 5],
            [8, 7]
        ],

        walls: [

            [8, 2],
            [7, 2],
            [6, 2],
            [5, 2],

            [5, 3],
            [5, 4],

            [3, 4],
            [3, 3],

            [3, 6],
            [3, 7],
            [3, 8],

            [5, 8],
            [6, 8],
            [7, 8],

            [7, 6],
            [8, 6]
        ]
    },


    /*
    LEVEL 9
    */

    {
        size: 10,

        bee: [9, 0],
        direction: 0,

        flowers: [
            [0, 9],
            [4, 5],
            [8, 9]
        ],

        walls: [

            [8, 1],
            [7, 1],
            [6, 1],
            [5, 1],

            [5, 2],
            [5, 3],
            [5, 4],

            [3, 4],
            [2, 4],
            [1, 4],

            [1, 5],
            [1, 6],
            [1, 7],

            [3, 7],
            [4, 7],
            [5, 7],
            [6, 7],

            [6, 8],
            [7, 8]
        ]
    },


    /*
    LEVEL 10
    FINAL CHALLENGE
    */

    {
        size: 10,

        bee: [9, 0],
        direction: 1,

        flowers: [
            [0, 9],
            [4, 4],
            [8, 8],
            [2, 7]
        ],

        walls: [

            [8, 1],
            [7, 1],
            [6, 1],
            [5, 1],
            [4, 1],

            [4, 2],
            [4, 3],

            [2, 3],
            [3, 3],

            [2, 4],
            [2, 5],

            [4, 5],
            [5, 5],
            [6, 5],

            [6, 6],
            [6, 7],

            [4, 7],
            [3, 7],

            [3, 8],
            [4, 8],
            [5, 8],
            [6, 8],
            [7, 8],

            [7, 9]
        ]
    }

];


let currentLevel = 0;

let bee;

let flowers = [];

let commands = [];

let running = false;


/*
===========================================================
LOAD LEVEL
===========================================================
*/

function loadLevel() {

    const level = levels[currentLevel];

    bee = {

        row: level.bee[0],

        col: level.bee[1],

        direction: level.direction

    };


    flowers = level.flowers.map(position => ({

        row: position[0],

        col: position[1],

        pollinated: false

    }));


    commands = [];


    document.getElementById("levelTitle").textContent =
        "Level " + (currentLevel + 1) +
        " of " + levels.length;


    document.getElementById("message").textContent =
        "Pollinate every flower! 🌼";


    document.getElementById("next").style.display =
        "none";


    drawBoard();

    updateCommands();

}


/*
===========================================================
CHECK WALL
===========================================================
*/

function isWall(row, col) {

    const walls = levels[currentLevel].walls;

    return walls.some(
        wall =>
            wall[0] === row &&
            wall[1] === col
    );

}


/*
===========================================================
DRAW BOARD
===========================================================
*/

function drawBoard() {

    const board =
        document.getElementById("board");

    const size =
        levels[currentLevel].size;


    board.innerHTML = "";

    board.style.gridTemplateColumns =
        `repeat(${size}, var(--cell-size))`;


    for (let row = 0; row < size; row++) {

        for (let col = 0; col < size; col++) {

            const cell =
                document.createElement("div");

            cell.className = "cell";


            /*
            WALL
            */

            if (isWall(row, col)) {

                cell.classList.add("wall");

                cell.textContent = "🧱";

            }


            /*
            FLOWER
            */

            const flower =
                flowers.find(
                    f =>
                        f.row === row &&
                        f.col === col
                );


            if (flower) {

                cell.textContent =
                    flower.pollinated
                        ? "🌸"
                        : "🌼";

            }


            /*
            BEE
            */

            if (
                bee.row === row &&
                bee.col === col
            ) {

                cell.classList.add("bee");

                cell.textContent = "🐝";

            }


            board.appendChild(cell);

        }

    }

}


/*
===========================================================
ADD COMMAND
===========================================================
*/

function addCommand(command) {

    if (running) return;

    commands.push(command);

    updateCommands();

}


/*
===========================================================
DISPLAY COMMANDS
===========================================================
*/

function updateCommands() {

    const box =
        document.getElementById("commands");


    if (commands.length === 0) {

        box.textContent =
            "No commands yet!";

        return;

    }


    box.innerHTML = "";


    const names = {

        forward: "⬆️ Forward",

        left: "↩️ Left",

        right: "↪️ Right",

        pollinate: "🌼 Pollinate"

    };


    commands.forEach((command, index) => {

        const span =
            document.createElement("span");

        span.className = "command";

        span.textContent =
            (index + 1) +
            ". " +
            names[command];


        box.appendChild(span);

    });

}


/*
===========================================================
RESET
===========================================================
*/

function resetLevel() {

    if (running) return;

    loadLevel();

}


/*
===========================================================
WAIT
===========================================================
*/

function sleep(milliseconds) {

    return new Promise(
        resolve =>
            setTimeout(resolve, milliseconds)
    );

}


/*
===========================================================
RUN PROGRAM
===========================================================
*/

async function runProgram() {

    if (
        running ||
        commands.length === 0
    ) {
        return;
    }


    running = true;


    document.getElementById("message").textContent =
        "🐝 Here we go!";


    for (
        let i = 0;
        i < commands.length;
        i++
    ) {

        const command = commands[i];


        await sleep(450);


        /*
        TURN LEFT
        */

        if (command === "left") {

            bee.direction--;

            if (bee.direction < 0) {

                bee.direction = 3;

            }

        }


        /*
        TURN RIGHT
        */

        else if (command === "right") {

            bee.direction++;

            if (bee.direction > 3) {

                bee.direction = 0;

            }

        }


        /*
        FORWARD
        */

        else if (command === "forward") {

            let newRow =
                bee.row;

            let newCol =
                bee.col;


            if (bee.direction === 0) {

                newRow--;

            }

            if (bee.direction === 1) {

                newCol++;

            }

            if (bee.direction === 2) {

                newRow++;

            }

            if (bee.direction === 3) {

                newCol--;

            }


            const size =
                levels[currentLevel].size;


            /*
            EDGE
            */

            if (
                newRow < 0 ||
                newRow >= size ||
                newCol < 0 ||
                newCol >= size
            ) {

                document.getElementById("message").textContent =
                    "💥 Bonk! The bee hit the edge!";

                running = false;

                drawBoard();

                return;

            }


            /*
            WALL
            */

            if (
                isWall(newRow, newCol)
            ) {

                document.getElementById("message").textContent =
                    "🚧 Bonk! That's a wall!";

                running = false;

                drawBoard();

                return;

            }


            /*
            MOVE
            */

            bee.row = newRow;

            bee.col = newCol;

        }


        /*
        POLLINATE
        */

        else if (
            command === "pollinate"
        ) {

            const flower =
                flowers.find(
                    f =>
                        f.row === bee.row &&
                        f.col === bee.col
                );


            if (flower) {

                if (!flower.pollinated) {

                    flower.pollinated = true;

                    document.getElementById("message").textContent =
                        "🌸 Beautiful! Flower pollinated!";

                } else {

                    document.getElementById("message").textContent =
                        "🌸 That flower is already pollinated!";

                }

            } else {

                document.getElementById("message").textContent =
                    "🐝 There's no flower here!";

            }

        }


        drawBoard();

    }


    await sleep(500);


    /*
    CHECK WIN
    */

    const allPollinated =
        flowers.every(
            flower =>
                flower.pollinated
        );


    if (allPollinated) {

        if (
            currentLevel ===
            levels.length - 1
        ) {

            document.getElementById("message").textContent =
                "🏆 YOU DID IT! All 10 levels complete! 🐝🌸";

        } else {

            document.getElementById("message").textContent =
                "🎉 Level complete! Every flower is pollinated!";

            document.getElementById("next").style.display =
                "inline-block";

        }

    } else {

        document.getElementById("message").textContent =
            "🌼 Not all the flowers are pollinated yet!";

    }


    running = false;

}


/*
===========================================================
NEXT LEVEL
===========================================================
*/

function nextLevel() {

    if (
        currentLevel <
        levels.length - 1
    ) {

        currentLevel++;

        loadLevel();

    }

}


/*
===========================================================
START GAME
===========================================================
*/

loadLevel();

</script>

</body>
</html>
